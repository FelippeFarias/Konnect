[dev-dependencies]
# The pcb_components fallback tests spawn a mock KiCAD NNG endpoint to prove
# a reachable-but-rejecting KiCAD never triggers the file-editing fallback.
nng.workspace = true
# The photo_intake live test draws its own synthetic board PNG rather than
# checking in a photo. `image` is already in this crate's tree through
# konnect-render, so this adds no crate to the build.
image.workspace = true
